name: Export verified 5U results and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: five-u-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ir0nsh3f/sbmsa-power-board
          ref: main
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test exact scoped export and immutable provenance
        run: python -m unittest discover -s tests -v
      - name: Export accepted source without collecting or refitting
        run: python scripts/export_site.py upstream
      - name: Test public asset syntax and scope
        run: |
          node --check site/app.js
          node --check site/schedules.js
          node --check site/league-schedule.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Publish Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
